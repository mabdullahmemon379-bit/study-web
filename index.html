<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Study Web Pro</title>

<style>

/* 🌐 GLOBAL */
html, body{
  margin:0;
  padding:0;
  overflow-x:hidden;
  overflow-y:auto;
  font-family:Arial;
  transition:0.4s;
}

/* 🌙 DARK */
body.dark{
  background:#001f4d;
  color:white;
}

/* ☀️ LIGHT */
body.light{
  background:#f2f2f2;
  color:black;
}

/* 🌟 STAR FIELD */
.stars, .shooting-stars{
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;
  z-index:-1;
}

/* ⭐ FALLING STARS (TOP → DOWN) */
.star{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  animation:fall linear infinite;
}

body.dark .star{ background:white; }
body.light .star{ background:black; }

@keyframes fall{
  0%{
    transform:translateY(-10vh);
    opacity:0;
  }
  20%{opacity:1;}
  100%{
    transform:translateY(110vh);
    opacity:0;
  }
}

/* 🌠 SHOOTING STARS (DIAGONAL) */
.shooting{
  position:absolute;
  width:3px;
  height:3px;
  background:white;
  border-radius:50%;
  animation:shoot 2s linear forwards;
}

@keyframes shoot{
  0%{
    transform:translate(0,0);
    opacity:1;
  }
  100%{
    transform:translate(400px,200px);
    opacity:0;
  }
}

/* 🧊 GLASS BOX */
.box{
  width:80%;
  max-width:700px;
  margin:120px auto;
  padding:20px;
  border-radius:15px;
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(10px);
  text-align:center;
}

/* BUTTONS */
button{
  padding:10px;
  margin:5px;
  cursor:pointer;
}

/* 🤖 CHATBOT */
.chatbot{
  position:fixed;
  bottom:10px;
  right:10px;
  width:260px;
  background:rgba(0,0,0,0.7);
  color:white;
  border-radius:10px;
  padding:10px;
}

.chatlog{
  height:120px;
  overflow-y:auto;
  font-size:12px;
  margin-bottom:5px;
}

input{
  width:100%;
  padding:5px;
}

</style>
</head>

<body class="dark">

<!-- 🌟 BACKGROUND -->
<div class="stars" id="stars"></div>
<div class="shooting-stars" id="shoot"></div>

<!-- 🌗 THEME -->
<button onclick="toggleTheme()">🌗 Theme</button>

<!-- 🧊 BOX -->
<div class="box">

<h2 id="title">Page 1</h2>
<p id="content">Welcome to Study Web 🚀</p>

<button onclick="prev()">⬅ Previous</button>
<button onclick="next()">Next ➡</button>

<br><br>

<button onclick="toggleSpeak()">🔊 Auto Speak</button>
<input type="range" min="0" max="1" step="0.1" value="1" onchange="setVolume(this.value)">

</div>

<!-- 🤖 CHATBOT -->
<div class="chatbot">
  <div class="chatlog" id="chatlog"></div>
  <input id="msg" placeholder="Ask me..." onkeydown="if(event.key==='Enter')send()">
</div>

<script>

/* 🌗 THEME */
function toggleTheme(){
  document.body.classList.toggle("light");
  document.body.classList.toggle("dark");
}

/* 📄 PAGES */
let page = 1;
let speakOn = false;
let volume = 1;

const pages = [
  "Welcome to Study Web 🚀",
  "This is page 2 📘",
  "This is page 3 📗"
];

function update(){
  document.getElementById("title").innerText = "Page " + page;
  document.getElementById("content").innerText = pages[page-1];
  if(speakOn) speak(pages[page-1]);
}

function next(){
  if(page < pages.length){
    page++;
    update();
  }
}

function prev(){
  if(page > 1){
    page--;
    update();
  }
}

/* 🔊 SPEECH */
function speak(text){
  let msg = new SpeechSynthesisUtterance(text);
  msg.volume = volume;
  speechSynthesis.speak(msg);
}

function toggleSpeak(){
  speakOn = !speakOn;
  alert("Auto Speak: " + speakOn);
}

function setVolume(v){
  volume = v;
}

/* 🌟 FALLING STARS */
for(let i=0;i<80;i++){
  let s = document.createElement("div");
  s.className = "star";
  s.style.left = Math.random()*100 + "%";
  s.style.animationDuration = (3 + Math.random()*5) + "s";
  s.style.animationDelay = Math.random()*5 + "s";
  document.getElementById("stars").appendChild(s);
}

/* 🌠 SHOOTING STARS */
setInterval(()=>{
  let sh = document.createElement("div");
  sh.className = "shooting";
  sh.style.top = Math.random()*50 + "%";
  sh.style.left = Math.random()*50 + "%";
  document.getElementById("shoot").appendChild(sh);

  setTimeout(()=>sh.remove(),2000);
},2500);

/* 🤖 SMART CHATBOT */
function send(){
  let input = document.getElementById("msg");
  let log = document.getElementById("chatlog");

  let text = input.value.toLowerCase();
  if(!text) return;

  log.innerHTML += "You: " + text + "<br>";

  let reply = "";

  if(text.includes("hi") || text.includes("hello")){
    reply = "Hello 👋 How can I help you?";
  }
  else if(text.includes("name")){
    reply = "I am your Study Assistant 🤖";
  }
  else if(text.includes("science")){
    reply = "Science is the study of nature, matter, energy and how everything works 🔬";
  }
  else if(text.includes("math")){
    reply = "Math is the study of numbers, shapes and patterns ➗";
  }
  else{
    reply = "I am still learning more topics 🤖";
  }

  log.innerHTML += "Bot: " + reply + "<br>";

  input.value="";
  log.scrollTop = log.scrollHeight;
}

</script>

</body>
</html>
