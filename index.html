<!DOCTYPE html>
<html>
<head>
<title>Vication study notes memon</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  text-align:center;
  background:#001f4d;
  overflow:hidden;
}

/* Moving stars */
.stars{
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;
  z-index:-1;
}

.star{
  position:absolute;
  width:4px;
  height:4px;
  background:white;
  border-radius:50%;
  animation:moveStar linear infinite;
}

@keyframes moveStar{
  0%{
    transform:translateY(100vh);
  }
  100%{
    transform:translateY(-100vh);
  }
}

/* Glass box */
.card{
  width:85%;
  min-height:500px;
  margin:50px auto;
  padding:35px;
  border-radius:35px;

  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(10px);

  border:none;
  box-shadow:none;
}

/* Text */
#title{
  color:white;
  font-size:40px;
}

#text{
  color:#f5f5f5;
  font-size:25px;
  line-height:1.8;
  padding:20px;
}

/* Glass buttons */
button{
  padding:15px 28px;
  margin:10px;
  border:none;
  border-radius:50px;

  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(8px);

  color:white;
  font-size:18px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.08);
  background:rgba(255,255,255,0.15);
}
</style>
</head>

<body>

<div class="stars">
<div class="star" style="left:5%; animation-duration:7s;"></div>
<div class="star" style="left:15%; animation-duration:9s;"></div>
<div class="star" style="left:25%; animation-duration:8s;"></div>
<div class="star" style="left:35%; animation-duration:10s;"></div>
<div class="star" style="left:45%; animation-duration:7s;"></div>
<div class="star" style="left:55%; animation-duration:11s;"></div>
<div class="star" style="left:65%; animation-duration:8s;"></div>
<div class="star" style="left:75%; animation-duration:9s;"></div>
<div class="star" style="left:85%; animation-duration:12s;"></div>
<div class="star" style="left:95%; animation-duration:7s;"></div>
</div>

<div class="card">
<h1 id="title"></h1>
<p id="text"></p>

<button onclick="prevPage()">⬅ Previous</button>
<button onclick="nextPage()">Next ➡</button>
<button onclick="speak()">🔊 Speak</button>
<button onclick="stopSpeak()">⛔ Stop</button>
</div>

<script>
let page = 0;

const pages = [

{
title:"Biology",
text:'Biology is the study of living organisms (plants, animals, humans, microorganisms) and their life processes.
  
Main divisions of Biology
  
Botany → Study of plants 🌱
  
Zoology → Study of animals 🐅
  
Microbiology → Study of microorganisms (bacteria, viruses, fungi) 🦠
  
Branches of Biology 
  
Morphology → Study of shape and structure
  
Anatomy → Study of internal body structure
  
Physiology → Study of body functions
  
Genetics → Study of heredity and genes
  
Ecology → Study of relation between organisms and environment
  
Embryology → Study of embryo development
  
Taxonomy → Classification of organisms
  
Paleontology → Study of fossils
  
Biochemistry → Study of chemicals in living things
  
Cell Biology/Cytology → Study of cells
  
Importance of Biology
  
Biology helps in:
  
medicine and health 🏥
  
agriculture 🌾
  
environment protection 🌍
  
understanding living organisms
  
Short definition to memorize:

Biology is the branch of science which deals with the study of life and living organisms'.
  
}
function showPage(){
document.getElementById("title").innerText =
pages[page].title;

document.getElementById("text").innerText =
pages[page].text;
}

function nextPage(){
speechSynthesis.cancel();

if(page < pages.length - 1){
page++;
showPage();
}
}

function prevPage(){
speechSynthesis.cancel();

if(page > 0){
page--;
showPage();
}
}

function speak(){
speechSynthesis.cancel();

let msg =
new SpeechSynthesisUtterance(
pages[page].title + ". " +
pages[page].text
);

msg.rate = 0.9;
speechSynthesis.speak(msg);
}

function stopSpeak(){
speechSynthesis.cancel();
}

showPage();
</script>

</body>
</html>
