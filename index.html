<!DOCTYPE html>
<html>
<head>
<title>Smart Study Web (Offline AI)</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#001a4d;
  color:white;
  overflow:hidden;
  transition:0.5s;
}

/* 🌙 LIGHT MODE */
body.light{
  background:#f2f2f2;
  color:black;
}

/* ⭐ STARS */
.stars{
  position:fixed;
  width:100%;
  height:100%;
  z-index:-1;
}

.star{
  position:absolute;
  width:3px;
  height:3px;
  background:white;
  border-radius:50%;
  animation: fall linear infinite;
}

@keyframes fall{
  from{transform:translateY(-10px);}
  to{transform:translateY(100vh);}
}

/* 🧊 GLASS BOX */
.box{
  width:60%;
  margin:60px auto;
  padding:20px;
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.3);
  border-radius:15px;
  backdrop-filter:blur(10px);
  text-align:center;
}
