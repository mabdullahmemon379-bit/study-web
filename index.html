<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Web Pro</title>

<style>
html,body{
  margin:0;
  padding:0;
  overflow-x:hidden;
  font-family:Arial,sans-serif;
  color:white;
  background:black;
}

/* BACKGROUND CANVAS */
#bg{
  position:fixed;
  inset:0;
  z-index:0;
}

/* STARS */
.stars{
  position:fixed;
  inset:0;
  z-index:1;
  overflow:hidden;
  pointer-events:none;
}

.star{
  position:absolute;
  width:2px;
  height:2px;
  background:#fff;
  border-radius:50%;
  animation:fall linear infinite;
}

@keyframes fall{
  from{transform:translateY(-10vh)}
  to{transform:translateY(110vh)}
}

/* SHOOTING STARS */
.shooting{
  position:absolute;
  width:3px;
  height:3px;
  background:white;
  border-radius:50%;
  animation:shoot 2s linear forwards;
}

@keyframes shoot{
  to{transform:translate(400px,200px);opacity:0}
}

/* UI */
.top-left,.top-right{
  position:fixed;
  top:10px;
  z-index:10;
}
.top-left{left:10px}
.top-right{right:10px}

/* CONTENT BOX */
.box{
  position:relative;
  z-index:20;
  width:min(800px,85%);
  margin:120px auto;
  padding:20px;
  border-radius:20px;
  background:rgba(255,255,255,.15);
  backdrop-filter:blur(10px);
  text-align:center;
}

button,select,input{
  padding:8px;
  margin:4px;
}

.notice{
  position:fixed;
  top:60px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.6);
  padding:10px 16px;
  border-radius:12px;
  display:none;
  z-index:50;
}

/* ✅ FIX ADDED: BOLD TEXT SYSTEM */
#content{
  white-space:pre-wrap;
  font-weight:500;
  line-height:1.7;
}

#content b{
  display:block;
  font-size:18px;
  font-weight:700;
  margin-top:10px;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>
<div class="stars" id="stars"></div>
<div class="notice" id="notice"></div>

<div class="top-left">
<select id="theme">
<option value="0">🌌 Space</option>
<option value="1">🌊 Ocean</option>
<option value="2">🔥 Fire</option>
<option value="3">🌲 Forest</option>
<option value="4">💜 Galaxy</option>
<option value="5">🌈 Rainbow</option>
<option value="6">⚡ Electric</option>
<option value="7">🌸 Sakura</option>
<option value="8">🤖 Cyberpunk</option>
<option value="9">🌠 Aurora</option>
</select>
</div>

<div class="top-right">
🔊 Volume<br>
<input type="range" id="vol" min="0" max="1" step="0.1" value="1">
</div>

<div class="box">
<h1 id="title"></h1>
<pre id="content"></pre>

<button onclick="prevPage()">⬅ Previous</button>
<button onclick="nextPage()">Next ➡</button>

<br><br>
<button onclick="startSpeak()">▶ Start Speak</button>
<button onclick="stopSpeak()">⏹ Stop Speak</button>
</div>

<script>

/* FIXED DOM */
const title = document.getElementById("title");
const content = document.getElementById("content");
const vol = document.getElementById("vol");
const theme = document.getElementById("theme");
const notice = document.getElementById("notice");
const stars = document.getElementById("stars");

/* PAGES */
const pages = [`
Biological Method

1. Observation
Scientists use senses and instruments.

2. Hypothesis
An intelligent guess.

3. Experiment
Testing hypothesis.

4. Conclusion
Result checking.
`];

let page = 0;
let speaking = false;

/* UPDATE */
function update(){
  title.textContent = "Page " + (page + 1);

  /* ✅ BOLD FIX APPLIED HERE */
  content.innerHTML = pages[page]
    .replace(/\n\n/g,"<br><br>")
    .replace(/([A-Z][a-zA-Z ]+)/g,"<b>$1</b>");

  if(speaking) speak(pages[page]);
}

function nextPage(){
  if(page < pages.length - 1){
    page++;
    update();
  }
}

function prevPage(){
  if(page > 0){
    page--;
    update();
  }
}

/* SPEECH */
function speak(text){
  speechSynthesis.cancel();
  let u = new SpeechSynthesisUtterance(text);
  u.volume = parseFloat(vol.value);
  speechSynthesis.speak(u);
}

function startSpeak(){
  speaking = true;
  show("🎤 Voice ON");
  speak(pages[page]);
}

function stopSpeak(){
  speaking = false;
  speechSynthesis.cancel();
  show("🔇 Voice OFF");
}

function show(t){
  notice.textContent = t;
  notice.style.display = "block";
  setTimeout(()=>notice.style.display="none",2000);
}

/* STARS */
for(let i=0;i<100;i++){
  let s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*100+"%";
  s.style.animationDuration=(3+Math.random()*6)+"s";
  stars.appendChild(s);
}

/* SHOOTING */
setInterval(()=>{
  let sh=document.createElement("div");
  sh.className="shooting";
  sh.style.left=Math.random()*50+"%";
  sh.style.top=Math.random()*50+"%";
  stars.appendChild(sh);
  setTimeout(()=>sh.remove(),2000);
},2500);

/* THEMES */
const themes=[
["#001f4d","#0a3d91"],["#006994","#00b4d8"],["#7f1d1d","#ff6b00"],
["#14532d","#22c55e"],["#2e1065","#7c3aed"],["#ff0080","#00dbde"],
["#0f172a","#38bdf8"],["#db2777","#f9a8d4"],["#111827","#06b6d4"],
["#065f46","#7dd3fc"]
];

const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
}
addEventListener("resize",resize);
resize();

let themeIndex=0;
theme.onchange=e=>themeIndex=+e.target.value;

function draw(){
  const g=ctx.createLinearGradient(0,0,canvas.width,canvas.height);
  g.addColorStop(0,themes[themeIndex][0]);
  g.addColorStop(1,themes[themeIndex][1]);

  ctx.fillStyle=g;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  requestAnimationFrame(draw);
}
draw();

update();

</script>

</body>
</html>
