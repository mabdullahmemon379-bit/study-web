<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Study Web Pro</title>

<style>

/* 🌐 BASE */
html, body{
  margin:0;
  padding:0;
  overflow-x:hidden;
  overflow-y:auto;
  font-family:Arial;
  transition:0.4s;
}

/* 🌙 DARK */
body.dark{
  background:#001f4d;
  color:white;
}

/* ☀️ LIGHT */
body.light{
  background:#f2f2f2;
  color:black;
}

/* 🌟 BACKGROUND */
.stars, .shoot{
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;
  z-index:-1;
}

/* ⭐ STARS FALL */
.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  animation:fall 6s linear infinite;
}

body.light .star{
  background:black;
}

@keyframes fall{
  0%{transform:translateY(-10vh); opacity:0;}
  20%{opacity:1;}
  100%{transform:translateY(110vh); opacity:0;}
}

/* 🧊 GLASS BOX */
.box{
  width:80%;
  max-width:700px;
  margin:100px auto;
  padding:20px;
  border-radius:15px;
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(10px);
  text-align:center;
}

/* 🔘 BUTTONS */
button{
  padding:10px;
  margin:5px;
  cursor:pointer;
}

/* 🤖 CHATBOT */
.chatbot{
  position:fixed;
  bottom:10px;
  right:10px;
  width:300px;
  background:rgba(0,0,0,0.75);
  color:white;
  border-radius:10px;
  padding:10px;
}

.chatlog{
  height:150px;
  overflow-y:auto;
  font-size:12px;
  margin-bottom:5px;
}

input{
  width:100%;
  padding:5px;
}

</style>
</head>

<body class="dark">

<!-- 🌟 BACKGROUND -->
<div class="stars" id="stars"></div>

<!-- 🌗 THEME -->
<button onclick="toggleTheme()">🌗 Theme</button>

<!-- 🧊 BOX -->
<div class="box">
<h2>🚀 AI Study Web Pro</h2>
<p>Full real ChatGPT AI chatbot system</p>
</div>

<!-- 🤖 CHATBOT -->
<div class="chatbot">
  <div class="chatlog" id="chatlog"></div>
  <input id="msg" placeholder="Ask anything..." onkeydown="if(event.key==='Enter')send()">
</div>

<script>

/* 🌗 THEME */
function toggleTheme(){
  document.body.classList.toggle("light");
  document.body.classList.toggle("dark");
}

/* 🌟 STARS */
for(let i=0;i<80;i++){
  let s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*100+"%";
  s.style.animationDuration=(3+Math.random()*5)+"s";
  document.getElementById("stars").appendChild(s);
}

/* 🤖 REAL AI CHATBOT */
async function send(){

  let input = document.getElementById("msg");
  let log = document.getElementById("chatlog");

  let text = input.value;
  if(!text) return;

  log.innerHTML += "You: " + text + "<br>";
  input.value="";

  log.innerHTML += "Bot: thinking... 🤖<br>";

  try {

    const res = await fetch("https://api.openai.com/v1/chat/completions", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer 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"
      },
      body:JSON.stringify({
        model:"gpt-4o-mini",
        messages:[
          {role:"system", content:"You are a helpful study assistant for students."},
          {role:"user", content:text}
        ]
      })
    });

    const data = await res.json();
    let reply = data.choices[0].message.content;

    log.innerHTML += "Bot: " + reply + "<br>";

  } catch(e){
    log.innerHTML += "Bot: Error connecting to AI ❌<br>";
  }

  log.scrollTop = log.scrollHeight;
}

</script>

</body>
</html>
