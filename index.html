<!DOCTYPE html>
<html>
<head>
<title>Smart Study Web Pro</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#001a4d;
  color:white;
  overflow:hidden;
  transition:0.5s;
}

body.light{
  background:#f2f2f2;
  color:black;
}

/* ⭐ STARS */
.stars{
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;
  z-index:-1;
}

.star{
  position:absolute;
  width:3px;
  height:3px;
  background:white;
  border-radius:50%;
  animation: fall linear infinite;
}

@keyframes fall{
  from{transform:translateY(-10px);}
  to{transform:translateY(100vh);}
}

/* 🧊 GLASS BOX */
.box{
  width:60%;
  margin:70px auto;
  padding:20px;
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.3);
  border-radius:15px;
  backdrop-filter: blur(10px);
  text-align:center;
}

body.light .box{
  background:rgba(0,0,0,0.08);
}

/* BUTTONS */
button{
  margin:6px;
  padding:10px 14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:rgba(255,255,255,0.2);
  color:inherit;
}

button:hover{
  background:rgba(255,255,255,0.3);
}

/* TOP CONTROLS */
.top{
  position:fixed;
  top:10px;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:0 10px;
}
</style>
</head>

<body>

<!-- ⭐ STARS -->
<div class="stars" id="stars"></div>

<!-- 🌙 MODE -->
<div class="top">
  <button onclick="toggleMode()">🌙 / ☀️ Mode</button>
</div>

<!-- 🎵 MUSIC -->
<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- 🎶 RINGTONE -->
<audio id="ringtone">
  <source src="ringtone.mp3" type="audio/mpeg">
</audio>

<!-- 🎚️ VOLUME -->
<div style="position:fixed;top:50px;right:10px;
background:rgba(255,255,255,0.1);padding:10px;border-radius:10px;">

🎵 Volume<br>
<input type="range" id="vol" min="0" max="100" value="50">
<br>
<button onclick="toggleMusic()">🎵 Play/Pause</button>
<button onclick="stopMusic()">⛔ Stop Music</button>

</div>

<!-- 🧊 NOTES -->
<div class="box">

<h2 id="title"></h2>
<p id="text"></p>

<button onclick="prev()">⬅ Prev</button>
<button onclick="next()">Next ➡</button>

<button onclick="speak()">🔊 Speak</button>
<button onclick="stopSpeak()">⛔ Stop Speak</button>

</div>

<script>

/* ⭐ STARS */
for(let i=0;i<70;i++){
  let s=document.createElement("div");
  s.classList.add("star");
  s.style.left=Math.random()*100+"vw";
  s.style.animationDuration=(2+Math.random()*5)+"s";
  document.getElementById("stars").appendChild(s);
}

/* 📝 NOTES */
const notes=[
 {t:"HTML",d:"HTML builds structure of websites."},
 {t:"CSS",d:"CSS styles websites."},
 {t:"JavaScript",d:"JS makes websites interactive."},
 {t:"Study Tip",d:"Practice daily for success."}
];

let i=0;

function load(){
 document.getElementById("title").innerText=notes[i].t;
 document.getElementById("text").innerText=notes[i].d;
}

function next(){ if(i<notes.length-1){i++;load();} }
function prev(){ if(i>0){i--;load();} }

/* 🔊 SPEAK */
let speech=null;

function speak(){
 stopSpeak();

 speech=new SpeechSynthesisUtterance();
 speech.text=notes[i].t+". "+notes[i].d;
 speech.rate=1;

 speechSynthesis.speak(speech);
}

function stopSpeak(){
 speechSynthesis.cancel();
}

/* 🌙 MODE */
function toggleMode(){
 document.body.classList.toggle("light");
}

/* 🎵 MUSIC */
let music=document.getElementById("music");
let vol=document.getElementById("vol");

music.volume=0.5;

vol.oninput=function(){
 music.volume=this.value/100;
}

function toggleMusic(){
 if(music.paused) music.play();
 else music.pause();
}

function stopMusic(){
 music.pause();
 music.currentTime=0;
}

/* 🎶 RINGTONE (plays once on load) */
window.onload=function(){
 let ring=document.getElementById("ringtone");
 ring.play().catch(()=>{});
 load();
};

</script>

</body>
</html>
