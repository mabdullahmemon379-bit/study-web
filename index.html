<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Study Web Pro</title>

<style>
/* 🌐 BASIC */
html, body{
  margin:0;
  padding:0;
  overflow-x:hidden;
  overflow-y:auto;
  font-family:Arial;
  transition:0.4s;
}

/* 🌙 DARK THEME */
body.dark{
  background:#001f4d;
  color:white;
}

/* ☀️ LIGHT THEME */
body.light{
  background:#f2f2f2;
  color:black;
}

/* 🌟 STARS */
.stars, .shooting-stars{
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;
  z-index:-1;
}

/* normal stars */
.star{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  animation:blink 2s infinite alternate;
}

body.dark .star{
  background:white;
}

body.light .star{
  background:black;
}

@keyframes blink{
  from{opacity:0.2;}
  to{opacity:1;}
}

/* shooting stars */
.shooting{
  position:absolute;
  width:3px;
  height:3px;
  background:white;
  animation:shoot 3s linear infinite;
}

@keyframes shoot{
  0%{transform:translate(0,0); opacity:1;}
  100%{transform:translate(400px,400px); opacity:0;}
}

/* 🧊 GLASS BOX */
.box{
  width:80%;
  max-width:700px;
  margin:120px auto;
  padding:20px;
  border-radius:15px;
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(10px);
  text-align:center;
}

/* buttons */
button{
  padding:10px;
  margin:5px;
  cursor:pointer;
}

/* chatbot */
.chatbot{
  position:fixed;
  bottom:10px;
  right:10px;
  width:250px;
  background:rgba(0,0,0,0.6);
  color:white;
  border-radius:10px;
  padding:10px;
}

.chatlog{
  height:120px;
  overflow-y:auto;
  font-size:12px;
  margin-bottom:5px;
}

input{
  width:100%;
  padding:5px;
}
</style>
</head>

<body class="dark">

<!-- 🌟 BACKGROUND -->
<div class="stars" id="stars"></div>
<div class="shooting-stars" id="shoot"></div>

<!-- 🔘 THEME BUTTON -->
<button onclick="toggleTheme()">🌗 Theme</button>

<!-- 🧊 MAIN BOX -->
<div class="box">

<h2 id="title">Page 1</h2>
<p id="content">Welcome to your Study Web 🚀</p>

<button onclick="prev()">⬅ Previous</button>
<button onclick="next()">Next ➡</button>

<br><br>

<!-- 🔊 SPEECH -->
<button onclick="toggleSpeak()">🔊 Auto Speak</button>
<input type="range" min="0" max="1" step="0.1" value="1" onchange="setVolume(this.value)">

</div>

<!-- 🤖 CHATBOT -->
<div class="chatbot">
  <div class="chatlog" id="chatlog"></div>
  <input id="msg" placeholder="Ask something..." onkeydown="if(event.key==='Enter')send()">
</div>

<script>

/* 🌗 THEME */
function toggleTheme(){
  document.body.classList.toggle("light");
  document.body.classList.toggle("dark");
}

/* 📄 PAGES */
let page = 1;
let speakOn = false;
let volume = 1;

const pages = [
  "Welcome to your Study Web 🚀",
  "This is page 2 content 📘",
  "This is page 3 content 📗"
];

function update(){
  document.getElementById("title").innerText = "Page " + page;
  document.getElementById("content").innerText = pages[page-1];
  if(speakOn) speak(pages[page-1]);
}

function next(){
  if(page < pages.length){
    page++;
    update();
  }
}

function prev(){
  if(page > 1){
    page--;
    update();
  }
}

/* 🔊 SPEECH */
function speak(text){
  let msg = new SpeechSynthesisUtterance(text);
  msg.volume = volume;
  speechSynthesis.speak(msg);
}

function toggleSpeak(){
  speakOn = !speakOn;
  alert("Auto Speak: " + speakOn);
}

function setVolume(v){
  volume = v;
}

/* 🌟 STARS GENERATOR */
for(let i=0;i<80;i++){
  let s = document.createElement("div");
  s.className = "star";
  s.style.top = Math.random()*100 + "%";
  s.style.left = Math.random()*100 + "%";
  document.getElementById("stars").appendChild(s);
}

/* 🌠 SHOOTING STARS */
setInterval(()=>{
  let sh = document.createElement("div");
  sh.className = "shooting";
  sh.style.top = Math.random()*50 + "%";
  sh.style.left = Math.random()*50 + "%";
  document.getElementById("shoot").appendChild(sh);

  setTimeout(()=>sh.remove(),3000);
},2000);

/* 🤖 SIMPLE CHATBOT */
function send(){
  let input = document.getElementById("msg");
  let log = document.getElementById("chatlog");

  let text = input.value;
  if(!text) return;

  log.innerHTML += "You: " + text + "<br>";

  let reply = "I am still learning 🤖";
  if(text.toLowerCase().includes("hi")) reply = "Hello! 👋";
  if(text.toLowerCase().includes("name")) reply = "I am your study assistant";

  log.innerHTML += "Bot: " + reply + "<br>";

  input.value="";
  log.scrollTop = log.scrollHeight;
}

</script>

</body>
</html>
