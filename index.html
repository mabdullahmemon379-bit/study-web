<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Study Web Pro</title>

<style>

/* 🌐 BASE */
html, body{
  margin:0;
  padding:0;
  overflow-x:hidden;
  overflow-y:auto;
  font-family:Arial;
  transition:0.4s;
}

/* 🌙 DARK THEME */
body.dark{
  background:#001f4d;
  color:white;
}

/* ☀️ LIGHT THEME */
body.light{
  background:#f2f2f2;
  color:black;
}

/* 🌟 BACKGROUND LAYERS */
.stars, .shooting-stars{
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;
  z-index:-1;
}

/* ⭐ FALLING STARS */
.star{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  animation:fall linear infinite;
}

body.dark .star{ background:white; }
body.light .star{ background:black; }

@keyframes fall{
  0%{
    transform:translateY(-10vh);
    opacity:0;
  }
  20%{opacity:1;}
  100%{
    transform:translateY(110vh);
    opacity:0;
  }
}

/* 🌠 SHOOTING STARS */
.shooting{
  position:absolute;
  width:3px;
  height:3px;
  border-radius:50%;
  background:white;
  animation:shoot 2s linear forwards;
}

@keyframes shoot{
  0%{
    transform:translate(0,0);
    opacity:1;
  }
  100%{
    transform:translate(400px,200px);
    opacity:0;
  }
}

/* 🧊 GLASS BOX */
.box{
  width:80%;
  max-width:700px;
  margin:120px auto;
  padding:20px;
  border-radius:15px;
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(10px);
  text-align:center;
}

/* 🔘 BUTTONS */
button{
  padding:10px;
  margin:5px;
  cursor:pointer;
}

/* 🎚 SLIDER */
input[type="range"]{
  width:60%;
}

</style>
</head>

<body class="dark">

<!-- 🌟 BACKGROUND -->
<div class="stars" id="stars"></div>
<div class="shooting-stars" id="shoot"></div>

<!-- 🌗 THEME BUTTON -->
<button onclick="toggleTheme()">🌗 Theme</button>

<!-- 🧊 MAIN BOX -->
<div class="box">

<h2 id="title">Page 1</h2>
<p id="content">Welcome to your Study Web 🚀</p>

<button onclick="prev()">⬅ Previous</button>
<button onclick="next()">Next ➡</button>

<br><br>

<!-- 🔊 SPEECH -->
<button onclick="toggleSpeak()">🔊 Auto Speak</button>

<br><br>

<!-- 🎚 VOLUME -->
Volume:
<input type="range" min="0" max="1" step="0.1" value="1" onchange="setVolume(this.value)">

</div>

<script>

/* 🌗 THEME */
function toggleTheme(){
  document.body.classList.toggle("light");
  document.body.classList.toggle("dark");
}

/* 📄 CONTENT PAGES */
let page = 1;
let speakOn = false;
let volume = 1;

const pages = [
  "Welcome to your Study Web 🚀",
  "This is page 2 - Learn English 📘",
  "This is page 3 - Science Notes 🔬",
  "This is page 4 - Mathematics ➗"
];

function update(){
  document.getElementById("title").innerText = "Page " + page;
  document.getElementById("content").innerText = pages[page-1];

  if(speakOn){
    speak(pages[page-1]);
  }
}

function next(){
  if(page < pages.length){
    page++;
    update();
  }
}

function prev(){
  if(page > 1){
    page--;
    update();
  }
}

/* 🔊 SPEECH SYSTEM */
function speak(text){
  let msg = new SpeechSynthesisUtterance(text);
  msg.volume = volume;
  speechSynthesis.speak(msg);
}

function toggleSpeak(){
  speakOn = !speakOn;
  alert("Auto Speak: " + (speakOn ? "ON" : "OFF"));
}

function setVolume(v){
  volume = v;
}

/* 🌟 FALLING STARS */
for(let i=0;i<80;i++){
  let s = document.createElement("div");
  s.className = "star";
  s.style.left = Math.random()*100 + "%";
  s.style.animationDuration = (3 + Math.random()*5) + "s";
  s.style.animationDelay = Math.random()*5 + "s";
  document.getElementById("stars").appendChild(s);
}

/* 🌠 SHOOTING STARS */
setInterval(()=>{
  let sh = document.createElement("div");
  sh.className = "shooting";
  sh.style.top = Math.random()*50 + "%";
  sh.style.left = Math.random()*50 + "%";
  document.getElementById("shoot").appendChild(sh);

  setTimeout(()=>sh.remove(),2000);
},2500);

</script>

</body>
</html>
