<!DOCTYPE html>
<html>
<head>
<title>My Study Website</title>

<style>
body{
  font-family: Arial, sans-serif;
  text-align:center;
  margin:0;
  padding:0;
  overflow:hidden;
  background:#001f4d;
}

/* Stars background */
.stars{
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;
  z-index:-1;
}

.star{
  position:absolute;
  width:4px;
  height:4px;
  background:white;
  border-radius:50%;
  animation: moveStar linear infinite;
}

@keyframes moveStar{
  0%{
    transform:translateY(100vh);
    opacity:0.5;
  }

  50%{
    opacity:1;
  }

  100%{
    transform:translateY(-100vh);
    opacity:0.3;
  }
}
/* Main note box */
.card{
  width:85%;
  min-height:320px;
  margin:60px auto;
  padding:35px;
  border-radius:30px;

  background:rgba(255,255,255,0.08);

  backdrop-filter: blur(8px);

  border:none;
  box-shadow:none;

  transition:0.5s;
}
  

/* Title */
#title{
  font-size:40px;
  color:white;
  text-shadow:0px 0px 8px rgba(255,255,255,0.5);
}

/* Note text */
#text{
  font-size:24px;
  color:#f5f5f5;
  padding:20px;
  line-height:1.8;
}

/* Buttons */
button{
  padding:14px 28px;
  margin:10px;
  border:none;
  border-radius:50px;
  font-size:18px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.1);
}

/* Button colors */
.prev{
  background:#ff7675;
  color:white;
}

.next{
  background:#55efc4;
}

.speak{
  background:#6c5ce7;
  color:white;
}

.stop{
  background:#2d3436;
  color:white;
}
</style>
</head>

<body>

<div class="stars">

<div class="star" style="left:5%; animation-duration:7s;"></div>

<div class="star" style="left:15%; animation-duration:10s;"></div>

<div class="star" style="left:25%; animation-duration:8s;"></div>

<div class="star" style="left:35%; animation-duration:12s;"></div>

<div class="star" style="left:45%; animation-duration:9s;"></div>

<div class="star" style="left:55%; animation-duration:11s;"></div>

<div class="star" style="left:65%; animation-duration:6s;"></div>

<div class="star" style="left:75%; animation-duration:13s;"></div>

<div class="star" style="left:85%; animation-duration:7s;"></div>

<div class="star" style="left:95%; animation-duration:10s;"></div>

</div>

<div class="card">
  <h1 id="title"></h1>
  <p id="text"></p>

  <button class="prev" onclick="prevPage()">⬅ Previous</button>

  <button class="next" onclick="nextPage()">Next ➡</button>

  <button class="speak" onclick="speak()">🔊 Speak</button>

  <button class="stop" onclick="stopSpeak()">⛔ Stop</button>
</div>

<script>
let page = 0;

/* Your boxes/notes */
const pages = [

{
title:"Biology",
text:"Cell is the basic unit of life.",
color:"#ffeaa7",
textColor:"#000"
},

{
title:"Physics",
text:"Force equals mass multiplied by acceleration.",
color:"#81ecec",
textColor:"#000"
},

{
title:"Chemistry",
text:"Water formula is H2O.",
color:"#fab1a0",
textColor:"#000"
},

{
title:"English",
text:"Present tense shows current action.",
color:"#a29bfe",
textColor:"#fff"
},

{
title:"Math",
text:"2 plus 2 equals 4.",
color:"#55efc4",
textColor:"#000"
}

];

/* Show page */
function showPage(){

document.getElementById("title").innerText =
pages[page].title;

document.getElementById("text").innerText =
pages[page].text;

document.querySelector(".card").style.background =
pages[page].color;

document.getElementById("title").style.color =
pages[page].textColor;

document.getElementById("text").style.color =
pages[page].textColor;
}

/* Next */
function nextPage(){
speechSynthesis.cancel();

if(page < pages.length - 1){
page++;
showPage();
}
}

/* Previous */
function prevPage(){
speechSynthesis.cancel();

if(page > 0){
page--;
showPage();
}
}

/* Speak */
function speak(){

speechSynthesis.cancel();

let msg =
new SpeechSynthesisUtterance(
pages[page].title + ". " +
pages[page].text
);

msg.rate = 0.9;
msg.pitch = 1;
msg.volume = 1;

speechSynthesis.speak(msg);
}

/* Stop voice */
function stopSpeak(){
speechSynthesis.cancel();
}

showPage();
</script>

</body>
</html>
