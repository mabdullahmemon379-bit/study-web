<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Study Web Pro</title>

<style>

html, body{
  margin:0;
  padding:0;
  overflow-x:hidden;
  overflow-y:auto;
  font-family:Arial;
  transition:0.5s;
}

/* 🌙 BASE */
body{
  background:#001f4d;
  color:white;
}

/* ☀️ LIGHT MODE (OVERRIDES EVERYTHING) */
body.light{
  background:#f2f2f2;
  color:black;
}

/* 🌈 THEMES (USE DATA ATTRIBUTE) */
body[data-theme="theme1"]{ background:#001f4d; }
body[data-theme="theme2"]{ background:#0f0f0f; }
body[data-theme="theme3"]{ background:#1a0033; }
body[data-theme="theme4"]{ background:#003333; }
body[data-theme="theme5"]{ background:#330000; }
body[data-theme="theme6"]{ background:#002b36; }
body[data-theme="theme7"]{ background:#1e3a8a; }
body[data-theme="theme8"]{ background:#2d1b69; }
body[data-theme="theme9"]{ background:#003f5c; }
body[data-theme="theme10"]{ background:#111827; }

/* 🌟 STARS */
.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  animation:fall linear infinite;
}

body.light .star{ background:black; }

@keyframes fall{
  0%{transform:translateY(-10vh); opacity:0;}
  100%{transform:translateY(110vh); opacity:1;}
}

/* BOX */
.box{
  width:80%;
  max-width:700px;
  margin:120px auto;
  padding:20px;
  border-radius:15px;
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(10px);
  text-align:center;
}

/* TOP LEFT */
.top-left{
  position:fixed;
  top:10px;
  left:10px;
  z-index:10;
}

/* TOP RIGHT */
.top-right{
  position:fixed;
  top:10px;
  right:10px;
  z-index:10;
}

button{
  padding:8px;
  margin:4px;
}

</style>
</head>

<body data-theme="theme1">

<div class="box">
<h2 id="title">Page 1</h2>
<p id="content">Welcome 🚀</p>
</div>

<!-- 🎨 THEME -->
<div class="top-left">
<select onchange="changeTheme(this.value)">
  <option value="theme1">Theme 1</option>
  <option value="theme2">Theme 2</option>
  <option value="theme3">Theme 3</option>
  <option value="theme4">Theme 4</option>
  <option value="theme5">Theme 5</option>
  <option value="theme6">Theme 6</option>
  <option value="theme7">Theme 7</option>
  <option value="theme8">Theme 8</option>
  <option value="theme9">Theme 9</option>
  <option value="theme10">Theme 10</option>
</select>

<button onclick="toggleLight()">☀️ Light</button>
</div>

<script>

/* 🌈 FIXED THEME SYSTEM */
function changeTheme(t){
  document.body.dataset.theme = t;
}

/* ☀️ LIGHT MODE */
function toggleLight(){
  document.body.classList.toggle("light");
}

</script>

</body>
</html>
